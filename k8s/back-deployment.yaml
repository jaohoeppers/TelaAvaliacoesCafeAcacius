apiVersion: apps/v1
kind: Deployment
metadata:
  name: back-app
  namespace: back-sist-cafe
spec:
  replicas: 4
  selector:
    matchLabels:
      app: back-app
  template:
    metadata:
      labels:
        app: back-app
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: back-app
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: back-app
                topologyKey: kubernetes.io/hostname
      containers:
        - name: back-app
          image: joaounidavi/imagem-back-sistema-cafeacacius:v1.0.1
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: back-config
            - secretRef:
                name: back-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"